# Builds the Chrome Web Store upload zip. Runs on every push to main that changes the extension, and on demand.
# - Every run uploads an artifact with the zip and the Web Store images.
# - "Run workflow" with "Create a GitHub release" also publishes a release extension-v<version> with the zip
#   attached, so it downloads directly (artifacts are always wrapped in an extra zip by GitHub).
name: Build extension package

on:
  push:
    branches: [ main ]
    paths:
      - 'extension/**'
      - '.github/workflows/build-extension.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release with the zip attached (bump the version in manifest.json first)
        type: boolean
        default: false
      collector_host_permission:
        description: Optional collector host permission override, e.g. https://collector.example.org/* (default https://*.azurewebsites.net/*)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
      zip: ${{ steps.pack.outputs.zip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test extension
        run: node --test extension/tests/*.test.mjs

      - name: Pack
        id: pack
        env:
          COLLECTOR_HOST_PERMISSION: ${{ inputs.collector_host_permission }}
        run: |
          bash extension/tools/pack.sh
          version=$(jq -r .version extension/manifest.json)
          zip="chromebook-activity-extension-v${version}.zip"
          test -f "extension/dist/$zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          {
            echo "### Extension v${version}"
            echo "Upload \`${zip}\` to the Chrome Web Store (Developer Dashboard → your item → Package → Upload new package)."
            echo "Download it from the **chrome-web-store-v${version}** artifact below, or from the release if one was created."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-v${{ steps.pack.outputs.version }}
          path: |
            extension/dist/${{ steps.pack.outputs.zip }}
            extension/store-assets/*.png
          if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chrome-web-store-v${{ needs.package.outputs.version }}
          path: out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          ZIP: ${{ needs.package.outputs.zip }}
        run: |
          tag="extension-v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump \"version\" in extension/manifest.json (the Chrome Web Store also rejects re-used versions)."
            exit 1
          fi
          # The artifact keeps the paths below extension/: out/dist/<zip> and out/store-assets/*.png
          mapfile -t files < <(find out -type f \( -name "$ZIP" -o -name '*.png' \) | sort)
          printf 'Attaching %s\n' "${files[@]}"
          gh release create "$tag" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Extension v${VERSION}" \
            --notes "Chrome Web Store upload package for extension v${VERSION}. Upload ${ZIP}; the PNG files are the store listing icon and small promo tile."
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
